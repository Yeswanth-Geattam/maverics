<!DOCTYPE html>
<html>
<head><title>Bot Test</title></head>
<body style="background:#111; color:#fff; font-family:sans-serif; padding:2rem;">
    <h2>Bot Test Page</h2>
    <p>If you can see the blue button at bottom-right, click it.</p>

    <!-- LAUNCHER BUTTON -->
    <div id="aiClinicalChatbotLauncher"
         style="position:fixed;bottom:25px;right:25px;z-index:99999999;
                background:linear-gradient(135deg,#0284c7,#0369a1);
                color:#fff;padding:0.85rem 1.4rem;border-radius:50px;
                box-shadow:0 10px 30px rgba(2,132,199,0.6);cursor:pointer;
                display:flex;align-items:center;gap:0.75rem;
                border:2px solid #38bdf8;font-weight:800;">
        🤖 <span>AI Clinical Copilot</span>
        <span style="background:rgba(16,185,129,0.25);color:#0F7C78;
                     font-size:0.7rem;padding:0.15rem 0.5rem;
                     border-radius:12px;font-weight:800;">LIVE XAI</span>
    </div>

    <!-- MODAL -->
    <div id="aiClinicalChatbotModal"
         style="display:none;position:fixed;bottom:85px;right:25px;
                z-index:99999999;width:380px;height:300px;
                background:#0a101f;border:2px solid #38bdf8;
                border-radius:16px;padding:1.5rem;color:#fff;
                flex-direction:column;align-items:center;
                justify-content:center;text-align:center;">
        <h3>✅ AI Bot is Working!</h3>
        <p>The modal opened successfully.</p>
        <button onclick="document.getElementById('aiClinicalChatbotModal').style.display='none'"
                style="margin-top:1rem;padding:0.5rem 1.5rem;background:#38bdf8;
                       border:none;border-radius:8px;color:#000;font-weight:800;cursor:pointer;">
            Close
        </button>
    </div>

    <script>
        document.getElementById('aiClinicalChatbotLauncher').addEventListener('click', function() {
            var m = document.getElementById('aiClinicalChatbotModal');
            m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
            console.log('Clicked! Display is now:', m.style.display);
        });
        console.log('Bot test script loaded OK');
    </script>
</body>
</html>
